<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plataforma de estudo para concursos: simulados FGV (DATAPREV 2024, TJPB 2026) e Cebraspe (PF Agente Administrativo), teoria por assunto, trilha de Português e videoaulas."
    />
    <title>Plataforma de Estudos · Simulados de Concurso</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E%3Ctext y=%2226%22 font-size=%2224%22%3E💻%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Top Global Header -->
    <header class="app-header">
      <div class="header-container">
        <div class="logo-area">
          <span class="logo-badge" id="concursoSigla">DATAPREV</span>
          <div class="logo-title">
            <h1 id="concursoTitulo">ATI · Desenvolvimento de Software</h1>
            <p id="concursoSubtitulo"></p>
          </div>
        </div>

        <div class="header-controls">
          <!-- Troca de concurso: cada um tem banco, teoria e progresso próprios -->
          <label for="concursoSelect" class="concurso-label">Concurso</label>
          <select
            class="select-filter concurso-select"
            id="concursoSelect"
            title="Trocar de concurso"
          ></select>

          <!-- Cronômetro Oficial de 4h -->
          <div
            class="timer-box"
            id="timerBox"
            title="Tempo oficial de prova FGV: 4 horas"
          >
            <span>⏱️</span>
            <span id="timerDisplay">04:00:00</span>
          </div>

          <!-- Ajuste de Acessibilidade de Fonte -->
          <button
            class="btn-icon"
            id="fontDecreaseBtn"
            title="Diminuir tamanho da fonte (A-)"
          >
            A-
          </button>
          <button
            class="btn-icon"
            id="fontIncreaseBtn"
            title="Aumentar tamanho da fonte (A+)"
          >
            A+
          </button>

          <!-- Toggle Modo Escuro / Claro -->
          <button
            class="btn-icon"
            id="themeToggleBtn"
            title="Alternar tema escuro/claro"
          >
            <span id="themeToggleIcon">🌙</span>
          </button>

          <!-- Reiniciar Simulado -->
          <button
            class="btn-icon"
            id="resetTestBtn"
            title="Treino: limpar as respostas do banco · Simulado: descartar ou começar outro"
            aria-label="Recomeçar"
            style="color: var(--danger)"
          >
            🔄
          </button>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs Bar -->
    <nav class="app-tabs-nav" aria-label="Navegação do aplicativo">
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="simulado">
          <span>📝</span> Simulado
          <span class="badge-counter" id="badgeSimuladoCount">0</span>
        </button>
        <button class="tab-btn" data-tab="teoria">
          <span>📚</span> Embasamento Teórico
        </button>
        <button class="tab-btn" data-tab="portugues">
          <span>✍️</span> Trilha de Português
          <span class="badge-counter" id="badgePtProgress">0%</span>
        </button>
        <button class="tab-btn" data-tab="estatisticas">
          <span>📊</span> Desempenho &amp; Notas
        </button>
        <button class="tab-btn" data-tab="foco">
          <span>🎯</span> Foco de Estudo
        </button>
        <button class="tab-btn" data-tab="erros">
          <span>❌</span> Caderno de Erros
          <span class="badge-counter" id="badgeErrorsCount">0</span>
        </button>
        <button class="tab-btn" data-tab="sobre">
          <span>ℹ️</span> Guia do Concurso
        </button>
      </div>
    </nav>

    <!-- Main Content Container -->
    <main class="app-main">
      <!-- ====================================================================
         ABA 1: SIMULADO INTERATIVO (70 QUESTÕES)
         ==================================================================== -->
      <section class="tab-content-panel" id="view-simulado">
        <!-- Toolbar: Modo de Resolução e Filtros -->
        <div class="toolbar-card">
          <div
            style="
              display: flex;
              align-items: center;
              gap: 0.75rem;
              flex-wrap: wrap;
            "
          >
            <span
              style="
                font-size: 0.88rem;
                font-weight: 700;
                color: var(--text-muted);
              "
              >Modo de Estudo:</span
            >
            <div class="mode-selector">
              <button
                class="mode-btn active"
                id="modeTreinoBtn"
                title="O banco inteiro, com filtros e gabarito comentado a cada resposta"
              >
                ⚡ Treino (banco completo)
              </button>
              <button
                class="mode-btn"
                id="modeProvaBtn"
                title="Simulado no formato do edital, cronometrado, corrigido só no fim"
              >
                🎯 Simulado (formato do edital)
              </button>
            </div>
          </div>

          <div class="filter-group">
            <!-- Filtro de Disciplinas Oficiais -->
            <label
              for="subjectFilterSelect"
              class="visually-hidden"
              >Disciplina</label
            >
            <select class="select-filter" id="subjectFilterSelect">
              <!-- Opções geradas a partir das disciplinas do concurso ativo -->
            </select>

            <!-- Filtro de Status -->
            <label
              for="statusFilterSelect"
              class="visually-hidden"
              >Situação da questão</label
            >
            <select class="select-filter" id="statusFilterSelect">
              <option value="all">Todos os Status</option>
              <option value="unanswered">Pendentes (Não respondidas)</option>
              <option value="answered">Respondidas</option>
              <option value="bookmarked">Salvas / Favoritas ⭐</option>
              <option value="wrong">Incorretas (Apenas Erros) ❌</option>
            </select>
          </div>

          <!-- Aparece quando o simulado foi filtrado por um assunto da teoria -->
          <div class="area-filter-chip" id="areaFilterChip" hidden></div>
        </div>

        <!-- Layout 2 colunas: questão + mapa de navegação -->
        <div class="quiz-grid-layout">
          <!-- Coluna Esquerda: Card da Questão -->
          <div id="questionCardContainer">
            <!-- Renderizado dinamicamente via app.js -->
          </div>

          <!-- Coluna direita: paleta com as questões do modo atual -->
          <aside class="palette-sidebar">
            <div class="palette-header">
              <h3>Mapa da Prova</h3>
              <span
                style="
                  font-size: 0.78rem;
                  font-weight: 700;
                  color: var(--primary);
                "
                id="paletteAnsweredCount"
                >0</span
              >
            </div>

            <div class="palette-legend">
              <div class="legend-item">
                <div class="legend-dot dot-unanswered"></div>
                <span>Pendente</span>
              </div>
              <div class="legend-item">
                <div class="legend-dot dot-answered"></div>
                <span>Respondida</span>
              </div>
              <div class="legend-item">
                <div class="legend-dot dot-correct"></div>
                <span>Correta</span>
              </div>
              <div class="legend-item">
                <div class="legend-dot dot-incorrect"></div>
                <span>Incorreta</span>
              </div>
              <div class="legend-item" style="grid-column: span 2">
                <div class="legend-dot dot-review"></div>
                <span>Em Dúvida (Marcador)</span>
              </div>
            </div>

            <div class="palette-grid" id="paletteGrid">
              <!-- Botões numéricos gerados dinamicamente via app.js -->
            </div>

            <div style="margin-top: 1.25rem; text-align: center">
              <!-- Finalizar (simulado em curso) ou Novo simulado (em revisão); some no treino -->
              <button
                class="btn-nav btn-finish-test"
                id="sidebarExamAction"
                style="width: 100%; justify-content: center"
                hidden
              ></button>
            </div>
          </aside>
        </div>
      </section>

      <!-- ====================================================================
         ABA 2: EMBASAMENTO TEÓRICO COMPLETO
         ==================================================================== -->
      <section class="tab-content-panel" id="view-teoria" style="display: none">
        <div class="theory-layout">
          <!-- Sidebar com índice de matérias e tópicos -->
          <nav
            class="theory-sidebar"
            id="theorySidebar"
            aria-label="Menu de matérias da teoria"
          >
            <!-- Gerado dinamicamente via app.js -->
          </nav>

          <!-- Leitor de Conteúdo Teórico -->
          <div id="theoryReader">
            <!-- Renderizado dinamicamente via app.js -->
          </div>
        </div>
      </section>

      <!-- ====================================================================
         ABA: TRILHA DE PORTUGUÊS
         ==================================================================== -->
      <section class="tab-content-panel" id="view-portugues" style="display: none">
        <div class="theory-layout">
          <nav
            class="theory-sidebar"
            id="ptSidebar"
            aria-label="Trilha de estudo de Língua Portuguesa"
          >
            <!-- Gerado dinamicamente via app.js -->
          </nav>
          <div id="ptReader">
            <!-- Renderizado dinamicamente via app.js -->
          </div>
        </div>
      </section>

      <!-- ====================================================================
         ABA 3: ESTATÍSTICAS E PAINEL DE DESEMPENHO
         ==================================================================== -->
      <section
        class="tab-content-panel"
        id="view-estatisticas"
        style="display: none"
      >
        <div id="statsViewContainer">
          <!-- Renderizado dinamicamente via app.js -->
        </div>
      </section>

      <!-- ====================================================================
         ABA 4: FOCO DE ESTUDO POR INCIDÊNCIA NA PROVA
         ==================================================================== -->
      <section class="tab-content-panel" id="view-foco" style="display: none">
        <div id="focusViewContainer">
          <!-- Renderizado dinamicamente via app.js -->
        </div>
      </section>

      <!-- ====================================================================
         ABA 5: CADERNO DE ERROS
         ==================================================================== -->
      <section class="tab-content-panel" id="view-erros" style="display: none">
        <div id="errosViewContainer">
          <!-- Renderizado dinamicamente via app.js -->
        </div>
      </section>

      <!-- ====================================================================
          ABA 6: GUIA DO CONCURSO DATAPREV
         ==================================================================== -->
      <section class="tab-content-panel" id="view-sobre" style="display: none">
        <div id="guiaViewContainer">
          <!-- Renderizado a partir do campo `guia` do concurso ativo -->
        </div>
      </section>    </main>

    <!-- Scripts -->
    <script src="js/questions.js"></script>
    <script src="js/theory.js"></script>
    <script src="js/portugues.js"></script>
    <script src="js/tjpb/base.js"></script>
    <script src="js/tjpb/eixo1-engenharia.js"></script>
    <script src="js/tjpb/eixo2-desenvolvimento.js"></script>
    <script src="js/tjpb/eixo3-dados.js"></script>
    <script src="js/tjpb/eixo4-governanca.js"></script>
    <script src="js/tjpb/rlm.js"></script>
    <script src="js/tjpb/concurso.js"></script>
    <script src="js/pf/base.js"></script>
    <script src="js/pf/portugues-rlm.js"></script>
    <script src="js/pf/direito.js"></script>
    <script src="js/pf/administracao.js"></script>
    <script src="js/pf/arquivo-etica-informatica.js"></script>
    <script src="js/pf/concurso.js"></script>
    <script src="js/concursos.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
